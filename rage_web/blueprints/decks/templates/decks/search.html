{% extends 'base.html' %} {% block content %}
<table class="table" id="search">
  <tbody>
    {% for deck in decks %}
    <tr>
      <td>
        <a href="{{ url_for('decks.read_deck', id=deck.id) }}">{{ deck.name }}</a>
      </td>
      <td>
        <a
          class="button"
          href="{{ url_for('decks.delete_deck', id=deck.id) }}"
        >
          <i class="bi bi-trash"></i> Excluir
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
